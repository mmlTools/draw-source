name: Windows Release on Main

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-tag-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from buildspec.json
        shell: pwsh
        run: |
          if (!(Test-Path "buildspec.json")) { throw "buildspec.json not found in repo root." }
          $spec = Get-Content -Raw "buildspec.json" | ConvertFrom-Json
          if (-not $spec.version) { throw "buildspec.json must contain 'version'." }

          $tag = "v$($spec.version)"
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Release tag: $tag"

      - name: Build (Windows)
        shell: pwsh
        env:
          CI: "true"
        run: |
          .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Locate plugin DLL
        shell: pwsh
        run: |
          $root = Join-Path $PWD "release/RelWithDebInfo"
          if (!(Test-Path $root)) { throw "Expected build output not found: $root" }

          # Prefer strict match if your dll name is known; update if needed:
          $preferred = "instant-highlight-source-draw.dll"

          $dll = Get-ChildItem -Path $root -Recurse -Filter $preferred -ErrorAction SilentlyContinue |
                 Select-Object -First 1

          if (-not $dll) {
            # Fallback: most recent DLL
            $dll = Get-ChildItem -Path $root -Recurse -Filter "*.dll" |
                   Sort-Object LastWriteTime -Descending |
                   Select-Object -First 1
          }

          if (-not $dll) { throw "No DLL found under $root" }

          "DLL_PATH=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using DLL: $($dll.FullName)"

      - name: Create ZIP (DLL only)
        shell: pwsh
        run: |
          $zipName = "Instant Higlights Source Draw.zip"

          if (Test-Path $zipName) { Remove-Item -Force $zipName }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Remove-Item -Force "dist\*" -ErrorAction SilentlyContinue

          Copy-Item -Force "${env:DLL_PATH}" "dist\"
          Compress-Archive -Path "dist\*" -DestinationPath $zipName -CompressionLevel Optimal

          "ZIP_PATH=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Created: $zipName"

      - name: Create tag if missing (points to this main commit)
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ env.TAG_NAME }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const { owner, repo } = context.repo;

            let exists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) {
              exists = false;
            }

            if (exists) {
              core.info(`Tag ${tag} already exists. Continuing to release step.`);
              return;
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            core.info(`Created tag: ${tag} -> ${context.sha}`);

      - name: Create/Update GitHub Release + upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Instant Higlights Source Draw ${{ env.TAG_NAME }}
          files: ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
