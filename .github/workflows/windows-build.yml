name: Release (Windows DLL)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_pack_release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_QT=ON `
            -DENABLE_FRONTEND_API=ON `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build (CMake)
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo --parallel

      - name: Find plugin DLL
        shell: pwsh
        run: |
          # If you know the exact dll name, set it here (recommended)
          $preferred = "instant-highlight-source-draw.dll"

          $dll = Get-ChildItem -Path "build" -Recurse -Filter $preferred -ErrorAction SilentlyContinue |
                 Select-Object -First 1

          if (-not $dll) {
            # Fallback: most recent DLL in build outputs
            $dll = Get-ChildItem -Path "build" -Recurse -Filter "*.dll" |
                   Sort-Object LastWriteTime -Descending |
                   Select-Object -First 1
          }

          if (-not $dll) { throw "No DLL found under build/ output." }

          "DLL_PATH=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using DLL: $($dll.FullName)"

      - name: Create ZIP (DLL only)
        shell: pwsh
        run: |
          $zipName = "Instant Higlights Source Draw.zip"

          if (Test-Path $zipName) { Remove-Item -Force $zipName }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Remove-Item -Force "dist\*" -ErrorAction SilentlyContinue

          Copy-Item -Force "${env:DLL_PATH}" "dist\"
          Compress-Archive -Path "dist\*" -DestinationPath $zipName -CompressionLevel Optimal

          "ZIP_PATH=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Created: $zipName"

      - name: Create GitHub Release + upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: Instant Higlights Source Draw ${{ github.ref_name }}
          files: ${{ env.ZIP_PATH }}
