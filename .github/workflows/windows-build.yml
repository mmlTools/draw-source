name: Auto Tag on Main

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from buildspec.json
        shell: pwsh
        run: |
          if (!(Test-Path "buildspec.json")) { throw "buildspec.json not found in repo root." }
          $spec = Get-Content -Raw "buildspec.json" | ConvertFrom-Json
          if (-not $spec.version) { throw "buildspec.json must contain 'version'." }

          $tag = "v$($spec.version)"
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tag to create (if missing): $tag"

      - name: Create tag if it does not exist
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check if tag already exists
            let exists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) {
              exists = false;
            }

            if (exists) {
              core.info(`Tag ${tag} already exists. Nothing to do.`);
              return;
            }

            // Create lightweight tag ref pointing to the commit that triggered this workflow
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            core.info(`Created tag: ${tag} -> ${context.sha}`);
